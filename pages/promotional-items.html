<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promotional Items - Pandey Enterprise</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="../assets/js/site-base.js"></script>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/home.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <section class="hero">
      <div class="hero__content">
        <p class="hero__eyebrow">PROMOTIONAL ITEMS</p>
        <h1 class="hero__title">Build Your Brand with <span class="hero__title-accent">Custom Promo Products</span></h1>
        <p class="hero__text">Branded merchandise and gifts that leave a lasting impression on clients and teams.</p>
        <div class="hero__actions">
          <button type="button" class="btn btn--primary">Shop Now</button>
          <a href="pages/contact.html" class="btn btn--outline">Get a Quote</a>
        </div>
      </div>
      <div class="hero__media">
        <img src="https://i.ibb.co/L0fV8K3/promo-items.png" alt="Promotional items">
      </div>
    </section>
    <header class="section-title">
      <p class="section-title__eyebrow">PRODUCTS</p>
      <h2 class="section-title__heading">Promotional <span class="section-title__accent">Catalog</span></h2>
    </header>
    <p class="hero__text" style="margin-bottom:40px">Custom printing and bulk orders available on request.</p>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/layout.js"></script>
</body>
</html>
